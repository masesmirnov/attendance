[project]
name = "attendance"
version = "1.0.0"
description = "Telegram bot: attendance from a screenshot -> Google Sheets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiogram>=3.31.0",
  "openai>=3.24.0",
  "openpyxl>=3.1.5",
  "google-api-python-client>=2.201.0",
  "google-auth>=2.60.0",
  "pydantic-settings>=2.15.0",
  "aiosqlite>=0.22.1"
]

[tool.setuptools.packages.find]
include = ["attendance*"]
